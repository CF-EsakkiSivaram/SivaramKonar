openapi: 3.0.0
info:
  title: Network Outage API
  version: 'v1'
servers:
  - url: https://dev.api.communityfibre.co.uk/dev/supernova/v1

paths:
  /0.0/outage-update:
     post:
      description: Network Outage API
      tags: 
        - NetworkOutage
      security:
        - bearerAuth: []
        
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                -  $ref: '#/components/schemas/Planned'      
                -  $ref: '#/components/schemas/Unplanned' 
                
            examples:
              Planned:
                value:
                  sentAt: '2025-02-12T14:30:00Z'
                  category: 'Planned'
                  id: 'INC000000001'
                  title: 'Network Planned Outage - Switch Replacement'
                  details: 'Scheduled network outage to replace a faulty switch in Region A.'
                  description: 'This change is intended to replace a faulty network switch to improve service stability in Region A.'
                  impact: 'Medium'
                  startDateTime: '2024-12-15T02:05:00'
                  endDateTime: ''
                  status: 'In Progress'
                  subStatus: 'Implementing solution'
                  notes:
                    - 'Switch replacement started at 02:05 UTC.'
                    - 'Network links have been disabled for affected services.'
                    - '50% of traffic has been rerouted successfully.'
                  impactedServices:
                    byServiceId:
                      - 'NET001'
                      - 'NET003'
                      - 'NET005'
                      
              Unplanned:
                value:
                  sentAt: '2025-02-12T14:30:00Z'
                  category: 'outage'
                  id: 'INC000000123'
                  title: 'Network Disruption in Region X'
                  details: 'Hardware failure identified. Replacement hardware is being installed.'
                  description: 'The root cause has been identified as a hardware failure in the core network. Replacement equipment is being installed to restore service.'
                  impact: 'high'
                  startDateTime: '2024-12-11T08:30:00'
                  estimatedEndDateTime: '2024-12-11T14:30:00'
                  endDateTime: ''
                  status: 'in progress'
                  subStatus: 'engineer dispatched'
                  notes:
                    - 'Hardware failure identified at 09:30 UTC.'
                    - 'Field engineers on-site and installing replacement hardware.'
                  impactedServices:
                    byServiceId:
                      - 'SVC002'
                      - 'SVC003'
                      - 'SVC004'
                    clearedServiceId:
                      - 'SVC001'
                      - 'SVC005'
                
                 
              
              
      responses:
        200:
          description: success
        
        400:                        
          description: MALFORMED_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                  code:
                    type: string
                    example: "MALFORMED_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Problem parsing request parameters - missing mandatory parameter(s)"
              example:
                uuid: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                code: "MALFORMED_REQUEST"
                messages:
                    - "Problem parsing request parameters - missing mandatory parameter(s)"


        401:  
          description: NOT_AUTHORISED
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                  code:
                    type: string
                    example: "NOT_AUTHORISED"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Not authorised to use this endpoint"
              example:
                uuid: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                code: "NOT_AUTHORISED"
                messages:
                    - "Not authorised to use this endpoint"


        422:                        
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "760053da-5785-4855-8c0a-e56bc749f4a6"
                  code:
                    type: string
                    example: "INVALID_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Invalid data was provided"
              example:
                uuid: "760053da-5785-4855-8c0a-e56bc749f4a6"
                code: "INVALID_REQUEST"
                messages:
                    - "Invalid data was provided"


        500:  
          description: SUPPLIER_FAULT
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                  code:
                    type: string
                    example: "SUPPLIER_FAULT"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "An unexpected system error occurred"
              example:
                uuid: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                code: "SUPPLIER_FAULT"
                messages:
                    - "An unexpected system error occurred"              


components:
  securitySchemes:
    bearerAuth:
      description: |
        The Apigee Gateway can support a number of different authentication mechanisms e.g. JWT bearer tokens
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Unplanned:
      type: object
      required:
      - sentAt
      - category
      - id
      - title
      - details
      - impact
      - startDateTime
      - estimatedEndDateTime
      - endDateTime
      - status
      - subStatus
      - impactedServices
      properties:
        sentAt:
          type: string
          example: "2025-02-12T14:30:00Z"
        category:
          type: string
          example: "outage"
        id:
          type: string
          example: "INC000000123"
        title:
          type: string
          example: "Network Disruption in Region X"
        details:
          type: string
          example: "Hardware failure identified. Replacement hardware is being installed."
        description:
          type: string
          example: "The root cause has been identified as a hardware failure in the core network. Replacement equipment is being installed to restore service."
        impact:
          type: string
          example: "high"
        startDateTime:
          type: string
          example: "2024-12-11T08:30:00"
        estimatedEndDateTime:
          type: string
          example: "2024-12-11T14:30:00"
        endDateTime:
          type: string
          example: ""
        status:
          type: string
          example: "in progress"
        subStatus:
          type: string
          example: "engineer dispatched"
        notes:
          type: array
          items:
            type: string
          example: ["Hardware failure identified at 09:30 UTC.", "Field engineers on-site and installing replacement hardware."]
        impactedServices:
          type: object
          required:
            - byServiceId
          properties:
            byServiceId:
              type: array
              items:
                type: string
              example: ["SVC002", "SVC003", "SVC004"]
            clearedServiceId:
              type: array
              items:
                type: string
              example: ["SVC001", "SVC005"]
        
    Planned:
      type: object
      required:
      - sentAt
      - category
      - id
      - title
      - details
      - impact
      - startDateTime
      - endDateTime
      - status
      - subStatus
      - impactedServices
      properties:
        sentAt:
          type: string
          example: "2025-02-12T14:30:00Z"
        category:
          type: string
          example: "Planned"
        id:
          type: string
          example: "INC000000001"
        title:
          type: string
          example: "Network Planned Outage - Switch Replacement"
        details:
          type: string
          example: "Scheduled network outage to replace a faulty switch in Region A."
        description:
          type: string
          example: "This change is intended to replace a faulty network switch to improve service stability in Region A."
        impact:
          type: string
          example: "Medium"
        startDateTime:
          type: string
          example: "2024-12-15T02:05:00"
        endDateTime:
          type: string
          example: ""
        status:
          type: string
          example: "In Progress"
        subStatus:
          type: string
          example: "Implementing solution"
        notes:
          type: array
          items:
            type: string
          example: ["Switch replacement started at 02:05 UTC.", "Network links have been disabled for affected services.","50% of traffic has been rerouted successfully." ]
        impactedServices:
          type: object
          required:
            - byServiceId
          properties:
            byServiceId:
              type: array
              items:
                type: string
              example: ["NET001", "NET003", "NET005"]