openapi: 3.0.0
info:
  title: WorkItem
  version: 'v1'
servers:
  - url: https://dev.api.communityfibre.co.uk/dev/work-item/v1
         
  
paths:
  /0.0/reassign:
     description: To reassign work item task as part of customer order journey.
     post:
      description: To reassign work item task as part of customer order journey.
      tags:
      - WorkItem
      security:
        - bearerAuth: []
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
            example: 'application/json'
            
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
              properties:
                itemId:
                  type: string
                  example: 'R-1321150923'
                userGroup:
                  type: string
                  example: 'Complaints'
                reassignRemarks:
                  type: string
                  example: 'item reassigned'
            example: 
              itemId: 'R-1321150923'
              userGroup: 'Complaints'
              reassignRemarks: 'item reassigned'
                  
                  
              
      responses:
        200:
          description: Successully fetched the response
          content:
            application/json:
              schema:
                type: object
                properties: 
                  statusList:
                    type: array
                    items:
                      type: object
                      properties:
                        statusCode:
                          type: string
                          example: '0000'
                        statusDescription:
                          type: string
                          example: 'Workitem Reassigned Succesfully'
                        statusType:
                          type: string
                          example: 'Informational'
              example: 
                statusList:
                  - statusCode: '0000'
                    statusDescription: 'Workitem Reassigned Succesfully'
                    statusType: 'Informational'
                  
                

        400:                        
          description: MALFORMED_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                  code:
                    type: string
                    example: "MALFORMED_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Problem parsing request parameters - missing mandatory parameter(s)"
              example:
                uuid: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                code: "MALFORMED_REQUEST"
                messages:
                    - "Problem parsing request parameters - missing mandatory parameter(s)"


        401:  
          description: NOT_AUTHORISED
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                  code:
                    type: string
                    example: "NOT_AUTHORISED"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Not authorised to use this endpoint"
              example:
                uuid: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                code: "NOT_AUTHORISED"
                messages:
                    - "Not authorised to use this endpoint"


        500:  
          description: SUPPLIER_FAULT
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                  code:
                    type: string
                    example: "SUPPLIER_FAULT"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "An unexpected system error occurred"
              example:
                uuid: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                code: "SUPPLIER_FAULT"
                messages:
                    - "An unexpected system error occurred"     
         
components:
  securitySchemes:
    bearerAuth:
      description: |
        The Apigee Gateway can support a number of different authentication mechanisms e.g. JWT bearer tokens
      type: http
      scheme: bearer
      bearerFormat: JWT                    
