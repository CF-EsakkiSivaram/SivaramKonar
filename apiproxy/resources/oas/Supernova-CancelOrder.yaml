openapi: 3.0.0
info:
  title: Supernova-CancelOrder API
  version: 'v1'
servers:
  - url: https://dev.api.communityfibre.co.uk/dev/supernova/v1

paths:
  /0.0/service-order-cancellations:
     description: Cancel inflight provide, cease or modify order
     post:
      description: Cancel inflight provide, cease or modify order
      tags: 
        - ServiceOrderCancellation
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Request-ID
          schema:
            type: string
            example: "avce"
          required: true
        - in: header
          name: X-Conversation-ID
          schema:
            type: string
            example: "1235urrjgn"
          required: true        
        - in: header
          name: Tenant
          schema:
            type: string
            example: "TENANT1"
          required: true        


      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - orderId
              - reasonCode
              properties:
                  id:
                    type: string
                    example: "VF-123"
                  orderId:
                    type: string
                    example: "O123"
                  reasonCode:
                    type: string
                    pattern: '[A-Z_]{5,25}'
                    example: "CUSTOMER_CHANGED_MIND"
            example:
              id: "VF-123"
              orderId: "O123"
              reasonCode: "CUSTOMER_CHANGED_MIND"


      responses:
        201:
          description: Order cancellation request was successful and the order has been cancelled.
          headers:
            X-Request-ID:
              schema:
                type: string
              required: true
            X-Conversation-ID:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "VF-123"
                  supplierReference:
                    type: string
                    example: "A123-1"
                  orderId:
                    type: string
                    example: "O123"
                  reasonCode:
                    type: string
                    example: "CUSTOMER_CHANGED_MIND"
              example:
                id: "VF-123"
                supplierReference: "A123-1"
                orderId: "O123"
                reasonCode: "CUSTOMER_CHANGED_MIND"


        400:                        
          description: MALFORMED_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                  code:
                    type: string
                    example: "MALFORMED_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Problem parsing request parameters - missing mandatory parameter(s)"
              example:
                uuid: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                code: "MALFORMED_REQUEST"
                messages:
                    - "Problem parsing request parameters - missing mandatory parameter(s)"


        401:  
          description: NOT_AUTHORISED
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                  code:
                    type: string
                    example: "NOT_AUTHORISED"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Not authorised to use this endpoint"
              example:
                uuid: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                code: "NOT_AUTHORISED"
                messages:
                    - "Not authorised to use this endpoint"


        422:                        
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "ae2b3f5b-9fe1-4127-a4e5-13eac457080d"
                  code:
                    type: string
                    example: "INVALID_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Order cancellation request invalid - unknown order"
              example:
                uuid: "ae2b3f5b-9fe1-4127-a4e5-13eac457080d"
                code: "INVALID_REQUEST"
                messages:
                    - "Order cancellation request invalid - unknown order"


        500:  
          description: SUPPLIER_FAULT
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                  code:
                    type: string
                    example: "SUPPLIER_FAULT"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "An unexpected system error occurred"
              example:
                uuid: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                code: "SUPPLIER_FAULT"
                messages:
                    - "An unexpected system error occurred"      


components:
  securitySchemes:
    bearerAuth:
      description: |
        The Apigee Gateway can support a number of different authentication mechanisms e.g. JWT bearer tokens
      type: http
      scheme: bearer
      bearerFormat: JWT