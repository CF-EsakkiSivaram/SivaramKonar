openapi: 3.0.0
info:
  title: Supernova-GetAppointment API
  version: 'v1'
servers:
  - url: https://dev.api.communityfibre.co.uk/dev/supernova/v1

paths:
  /0.0/available-appointments:
    get:
      summary: Get available appointments
      security:
        - bearerAuth: []
      parameters:

        - in: query
          name: address
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - type
                properties:
                  id:
                    type: string
                    example: "5057066"
                  type:
                    type: string
                    example: "UPRN"
        - in: query
          name: serviceSpecification
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    example: "10"
                  name:
                    type: string
                    example: "FTTH"
        - in: query
          name: appointmentFromDate
          schema:
            type: string
            example: "2022-01-05"
        - in: query
          name: classifications
          schema:
            type: array
            items:
              type: string
              example: 
              - "WEEKDAY_AM"
              - "WEEKDAY_PM"
              enum:
                - WEEKDAY
                - WEEKDAY_AM
                - WEEKDAY_PM
                - WEEKDAY_EARLY
                - WEEKDAY_EVENING
                - SATURDAY
                - SATURDAY_AM
                - SATURDAY_PM
                - SATURDAY_EARLY
                - SATURDAY_EVENING
                - SUNDAY
                - SUNDAY_AM 
                - SUNDAY_PM
                - SUNDAY_EARLY
                - SUNDAY_EVENING
        - in: query
          name: appointmentPurpose
          required: true
          schema:
            enum:
              - PROVIDE
              - REPAIR
            type: string
            example: "PROVIDE"
        - in: header
          name: X-Request-ID
          required: true
          schema:
            type: string
            example: "avce"
        - in: header
          name: X-Conversation-ID
          required: true
          schema:
            type: string
            example: "1235urrjgn"
        - in: header
          name: Tenant
          required: true
          schema:
            type: string
            example: "TALKTALK_SIT"


      responses:
        '200':
          description: A list of available timeslots
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "5057066"
                      type:
                        type: string
                        example: "UPRN"
                  serviceSpecification:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "10"
                      name:
                        type: string
                        example: "FTTH"
                  availableTimeslots:
                    type: array
                    items:
                      type: object
                      properties:
                        timeslotStartDateTime:
                          type: string
                          format: date-time
                          example: "2025-01-03T08:00:00.000Z"
                        timeslotEndDateTime:
                          type: string
                          format: date-time
                          example: "2025-01-03T13:00:00.000Z"
                        standard:
                          type: boolean
                          example: true
              example:
                address: 
                  id: "5057066"
                  type: "UPRN"
                serviceSpecification: 
                  id: "10"
                  name: "FTTH"
                availableTimeslots: 
                  - timeslotStartDateTime: "2025-01-03T08:00:00.000Z"
                    timeslotEndDateTime: "2025-01-03T13:00:00.000Z"
                    standard: true
                  - timeslotStartDateTime: "2025-01-03T13:00:00.000Z"
                    timeslotEndDateTime: "2025-01-03T18:00:00.000Z"
                    standard: true


        '400':                        
          description: MALFORMED_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                  code:
                    type: string
                    example: "MALFORMED_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Problem parsing request parameters - missing mandatory parameter(s)"
              example:
                uuid: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                code: "MALFORMED_REQUEST"
                messages:
                    - "Problem parsing request parameters - missing mandatory parameter(s)"


        '401':  
          description: NOT_AUTHORISED
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                  code:
                    type: string
                    example: "NOT_AUTHORISED"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Not authorised to use this endpoint"
              example:
                uuid: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                code: "NOT_AUTHORISED"
                messages:
                    - "Not authorised to use this endpoint"


        '500':  
          description: SUPPLIER_FAULT
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                  code:
                    type: string
                    example: "SUPPLIER_FAULT"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "An unexpected system error occurred"
              example:
                uuid: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                code: "SUPPLIER_FAULT"
                messages:
                    - "An unexpected system error occurred"


components:
  securitySchemes:
   bearerAuth:
      description: |
        The Apigee Gateway can support a number of different authentication mechanisms e.g. JWT bearer tokens
      type: http
      scheme: bearer
      bearerFormat: JWT
