openapi: 3.0.0
info:
  title: Supernova-ReserveAppointment API
  version: 'v1'
servers:
  - url: https://dev.api.communityfibre.co.uk/dev/supernova/v1
  
paths:
  /0.0/appointments:
    description: Reserve an appointment slot..
    post:
      tags:
      - Appointment
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Request-ID
          schema:
           type: string
           example: 'avce'
          required: true
        - in: header
          name: X-Conversation-ID
          schema:
           type: string
           example: '1235urrjgn'
          required: true
        - in: header
          name: Tenant
          schema:
           type: string
           example: 'TENANT1'
          required: true


      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
               - id
               - address
               - serviceSpecification
               - timeslot
              properties:
                id:
                  type: number
                  minimum: 1
                  example: 234
                address:
                  type: object
                  required: 
                   - id
                   - type
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 12
                      example: "5019905"
                    type:
                      type: string
                      enum:
                        - UPRN
                      example: "UPRN"
                serviceSpecification:
                  type: object
                  required: 
                   - id
                  properties:
                    id:
                      type: string
                      enum:
                        - ftthl2r
                      example: "ftthl2r"
                purpose:
                  type: string
                  enum:
                    - PROVIDE
                    - REPAIR
                  example: "PROVIDE"
                timeslot:
                  type: object
                  required:
                  - timeslotStartDateTime
                  - timeslotEndDateTime
                  properties:
                    timeslotStartDateTime:
                            type: string
                            format: date-time
                            example: '2023-08-25T10:00:00.000Z'
                    timeslotEndDateTime:
                            type: string
                            format: date-time
                            example: '2023-08-25T15:00:00.000Z'


      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
               type: object
               properties:
                id:
                  type: integer
                  example: 234
                supplier:
                  type: string
                  example: CFL
                supplierReference:
                  type: string
                  example: IJQPXDO3YR
                address:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: '5057066'
                    type:
                      type: string
                      example: 'UPRN'
                serviceSpecification:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: '996265'
                    name:
                      type: string
                      example: 'FTTH'
                purpose:
                  type: string
                  example: PROVIDE
                timeslot:
                  type: object
                  properties:
                    timeslotStartDateTime:
                            type: string
                            example: '2022-08-25T10:00:00.000Z'
                    timeslotEndDateTime:
                            type: string
                            example: '2022-08-25T15:00:00.000Z'
                    standard:
                      type: boolean
                      example: true
                expiryDateTime:
                  type: string
                  example: '2022-09-01T13:45:00.000Z'


        400:                        
          description: MALFORMED_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                  code:
                    type: string
                    example: "MALFORMED_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Problem parsing request parameters - missing mandatory parameter(s)"
              example:
                uuid: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                code: "MALFORMED_REQUEST"
                messages:
                    - "Problem parsing request parameters - missing mandatory parameter(s)"


        401:  
          description: NOT_AUTHORISED
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                  code:
                    type: string
                    example: "NOT_AUTHORISED"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Not authorised to use this endpoint"
              example:
                uuid: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                code: "NOT_AUTHORISED"
                messages:
                    - "Not authorised to use this endpoint"


        422:                        
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "c312ebdc-589f-4dc9-8f47-48e4a6e6b4df"
                  code:
                    type: string
                    example: "INVALID_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Amend Order request InValid"
              example:
                uuid: "c312ebdc-589f-4dc9-8f47-48e4a6e6b4df"
                code: "INVALID_REQUEST"
                messages:
                    - "Amend Order request InValid"


        500:  
          description: SUPPLIER_FAULT
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                  code:
                    type: string
                    example: "SUPPLIER_FAULT"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "An unexpected system error occurred"
              example:
                uuid: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                code: "SUPPLIER_FAULT"
                messages:
                    - "An unexpected system error occurred"   


components:
 securitySchemes:
  bearerAuth:
      description: |
        The Apigee Gateway can support a number of different authentication mechanisms e.g. JWT bearer tokens
      type: http
      scheme: bearer
      bearerFormat: JWT