openapi: 3.0.0
info:
  title: Supernova-AmendOrder-Cease API
  version: 'v1'
servers:
  - url: https://dev.api.communityfibre.co.uk/dev/supernova/v1
  
paths:
  /0.0/service-order-amendments:
    description: Cease Service Order Amendment
    post:
      description: Cease Service Order Amendment
      tags:
      - ServiceOrderAmendment
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-ID
          in: header
          required: true
          schema:
            type: string
        - name: X-Conversation-ID
          in: header
          required: true
          schema:
            type: string
        - name: Tenant
          in: header
          required: true
          schema:
            type: string
            example: 'TENANT1'


      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - orderId
              - requestedCompletionDate
              properties:
                id: 
                  type: string
                  example: "VF-123"
                orderId:
                  type: string
                  example: "O123"
                requestedCompletionDate:
                  type: string
                  format: date-time
                  example: '2022-01-10T09:00:00.000Z'
            example:
              id: "VF-123"
              orderId: "O123"
              requestedCompletionDate: '2022-01-10T09:00:00.000Z'


      responses:
        201:
          description: Update received
          headers:
            X-Request-ID:
              schema:
                type: string
              required: true
            X-Conversation-ID:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: 
                    type: string
                    example: "VF-123"
                  supplierReference:
                    type: string
                    example: 'A123-1'
                  orderId:
                    type: string
                    example: "O123"
                  requestedCompletionDate:
                    type: string
                    example: '2022-01-10T09:00:00.000Z'
                  committedDate:
                    type: string
                    example: '2022-01-01T09:09:33.001Z'
                  targetDate:
                    type: string
                    example: '2022-01-01T09:09:33.001Z'
              example:
                id: "VF-123"
                supplierReference: 'A123-1'
                orderId: "O123"
                requestedCompletionDate: '2022-01-10T09:00:00.000Z'
                committedDate: '2022-01-01T09:09:33.001Z'
                targetDate: '2022-01-01T09:09:33.001Z'

  
        400:                        
          description: MALFORMED_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                  code:
                    type: string
                    example: "MALFORMED_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Problem parsing request parameters - missing mandatory parameter(s)"
              example:
                uuid: "2b7e6837-0ec3-4ee9-acba-8250768c5ef9"
                code: "MALFORMED_REQUEST"
                messages:
                    - "Problem parsing request parameters - missing mandatory parameter(s)"


        401:  
          description: NOT_AUTHORISED
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                  code:
                    type: string
                    example: "NOT_AUTHORISED"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Not authorised to use this endpoint"
              example:
                uuid: "1e7e7ebc-c797-4d60-a81c-940b40631957"
                code: "NOT_AUTHORISED"
                messages:
                    - "Not authorised to use this endpoint"


        422:                        
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "c312ebdc-589f-4dc9-8f47-48e4a6e6b4df"
                  code:
                    type: string
                    example: "INVALID_REQUEST"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "Amend Order request InValid"
              example:
                uuid: "c312ebdc-589f-4dc9-8f47-48e4a6e6b4df"
                code: "INVALID_REQUEST"
                messages:
                    - "Amend Order request InValid"


        500:  
          description: SUPPLIER_FAULT
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                  code:
                    type: string
                    example: "SUPPLIER_FAULT"
                  messages:
                    type: array
                    items:
                      type: string
                      example: "An unexpected system error occurred"
              example:
                uuid: "43c871f3-18f4-46f8-9674-26ccd1dcee14"
                code: "SUPPLIER_FAULT"
                messages:
                    - "An unexpected system error occurred"     


components:
  securitySchemes:
    bearerAuth:
      description: |
        The Apigee Gateway can support a number of different authentication mechanisms e.g. JWT bearer tokens
      type: http
      scheme: bearer
      bearerFormat: JWT